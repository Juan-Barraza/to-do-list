
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist-app
    ports: 
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todolist-net
    volumes:
      - ./:/app 
  db:
    image: postgres:14
    container_name: todolist-db
    env_file:
      - .env
    volumes:
    - postgres_data:/var/lib/postgresql/data 
    ports:
    - "5432:5432"
    networks:
      - todolist-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:

networks:
  todolist-net:
    